[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "astro dev"
  targetPort = 4321
  framework = "#custom"
  port = 8888

# /admin is never indexed and never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The entry form moved from /log/ to /post/ ("post your round").
[[redirects]]
  from = "/log/*"
  to = "/post/"
  status = 301
